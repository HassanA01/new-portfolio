name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint, types, tests, and application build in Docker
        run: docker build --target test -t portfolio-test .
      - name: Verify production container build
        run: docker build --target production -t portfolio-production .
